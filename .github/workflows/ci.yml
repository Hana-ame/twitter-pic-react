name: Build and Release

# 纯构建门禁：验证当前 tree 能编译通过。不做部署 —— 前端产物仍由 build.sh
# （npm run build + scp 到 vps:~/twitter/）人工触发，与 go 仓的 tag→release→
# ExecStartPre 自动拉取链路不同。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Static Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint + tests
        run: npx react-scripts test --watchAll=false --ci

      - name: Build
        env:
          CI: false
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 7
