    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- 告知爬虫与安全过滤器该页面为成人内容，避免全站隐瞒判定 -->
    <meta name="rating" content="RTA-5042-1996-1400-1577-RTA" />
    <meta name="rating" content="adult" />
    <meta
      name="推图 - 推特看图纯享版"
      content="推图 - 推特看图纯享版，免年龄验证，免翻墙"
    />

    <!-- iOS 支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="推图" />
    <link
      rel="apple-touch-icon"
      href="https://twimg.moonchan.xyz/favicon.ico"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // 2. Register Service Worker after page loads
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
      // Note: We removed the "preventDefault()" line so the prompt CAN show
    </script>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>推图 - 推特看图纯享版</title>

    <link rel="preconnect" href="https://twimg.moonchan.xyz" crossorigin="" />
    <!-- <link rel="preconnect" href="https://video.twimg.com" crossorigin=""> -->
  </head>

  <body>
    <noscript>啥游览器啊不支持JS，换一个再来看看吧</noscript>
    <!-- 年龄确认遮罩（2026-10-22 加，localStorage 记忆 30 天） -->
    <div id="age-gate" style="position:fixed;inset:0;z-index:99999;background:rgba(10,10,14,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="max-width:420px;width:100%;background:#16161d;border:1px solid #2a2a35;border-radius:16px;padding:32px 28px;text-align:center;color:#e7e7ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="font-size:44px;line-height:1;margin-bottom:14px;">🔞</div>
        <h1 style="font-size:20px;font-weight:700;margin:0 0 10px;">本网站包含成人内容</h1>
        <p style="font-size:14px;line-height:1.7;color:#9a9aa8;margin:0 0 22px;">仅面向年满 18 周岁的成年人。本站收录的图片/视频可能包含露骨内容，未成年人与反感者请立即离开。</p>
        <button id="age-gate-enter" type="button" style="width:100%;padding:12px 16px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;border-radius:10px;cursor:pointer;margin-bottom:10px;">我已年满 18 周岁，进入</button>
        <button id="age-gate-leave" type="button" style="width:100%;padding:12px 16px;font-size:14px;color:#9a9aa8;background:transparent;border:1px solid #2a2a35;border-radius:10px;cursor:pointer;">离开</button>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "tw_age_verified";
        function hide() { var g = document.getElementById("age-gate"); if (g) g.style.display = "none"; }
        function verified() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }
        if (verified()) { hide(); }
        else {
          var enter = document.getElementById("age-gate-enter");
          var leave = document.getElementById("age-gate-leave");
          if (enter) enter.addEventListener("click", function () {
            try { localStorage.setItem(KEY, "1"); } catch (e) {}
            hide();
          });
          if (leave) leave.addEventListener("click", function () {
            window.location.href = "https://www.bing.com";
          });
        }
      })();
    </script>
    <div id="root">
    </div>

    <!-- 广告位（body 底部）：恢复广告投送时在此插入 popMagic/pemsrv 脚本；当前已于 2026-10-22 关闭 -->
  </body>
</html>
